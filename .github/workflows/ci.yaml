name: ci

# The repo had no workflow, so every pull request in ao-pi was merged on whoever
# ran the suite locally (az-iar/ao-pi#7). This is the same shape as ao-runner's:
# the checks a reviewer would run by hand, on push and on every pull request.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # One run per branch: a force-push or a second push cancels the older run
  # rather than paying for it twice.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The tests talk to a loopback fake office (test/fake-office.mts) and open no
    # other network connection, so the shared runner is enough.
    runs-on: [self-hosted, ai-om]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # package.json's test script passes --experimental-strip-types, which
          # needs 22.18 or newer.
          node-version: ">=22.18"
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm test
